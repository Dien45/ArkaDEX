# ClayMorphism Theme - Light Blue Variant
# Based on ArkaDEX project configuration

# Color Palette
colors:
  primary: #4A90E2      # Light blue (primary)
  secondary: #5B7D8B     # Muted steel blue
  accent: #88C0D0       # Soft cyan accent
  background: #FAF9FF    # Very light blue-ish background
  surface: #F0F4FC      # Surface color
  border: #D4D9E2       # Subtle border
  text: #2D3436         # Dark gray text
  shadow: #1F236b       # Shadow depth

# Typography
fonts:
  body: 'Inter'
  heading: 'JetBrains Mono'

# Layout
window_manager:
  mode: freeform        # Freeform window arrangement
  resizable: true
  movable: true
  minimize: true
  maximize: true
  snap: auto
  floor: true           # Floor space for floating panels

# Background Effects
effects:
  paper_drop: true
  canvas_depth: 0.15
  motion: subtle
