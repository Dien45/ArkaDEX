name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArkaDEX
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # platform + build-tools are required to compile (platform-tools alone is not enough)
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Setup Gradle 8.7 (AGP 8.2 needs Gradle 8.x; runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ArkaDEX/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ArkaDEX/app/build/outputs/apk/debug/app-debug.apk
