name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArkaDEX
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # platform + build-tools are required to compile (platform-tools alone is not enough)
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Build Debug APK (system Gradle, 8.2+ for AGP 8.2)
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ArkaDEX/app/build/outputs/apk/debug/app-debug.apk
