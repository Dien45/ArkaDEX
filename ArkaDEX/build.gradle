plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.ardex.dex'
    compileSdk 34

    defaultConfig {
        applicationId "com.ardex.dex"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}