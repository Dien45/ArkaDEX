plugins {
    id 'com.android.application' version '8.2.0' apply false
}

android {
    namespace 'com.ardex.dex'
    compileSdk 34
}

buildTypes {
    release {
        minifyEnabled false
        proguardFiles(
            getDefaultProguardFile('proguard-android-optimize.txt'),
            'proguard-rules.prod.txt'
        )
    }
}

repositories {
    google()
    mavenCentral()
}
